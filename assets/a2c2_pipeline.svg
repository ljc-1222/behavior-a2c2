<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="440" viewBox="0 0 1160 440" role="img" aria-label="A2C2 action chunk correction pipeline with frozen Comet, latest observations, residual prediction and clipped action execution">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1428"/><stop offset="1" stop-color="#152641"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#a1b7d3" stroke-width="1.6"/></marker>
  <style>
    .title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f2f7ff}
    .sub{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#aabed6}
    .head{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f2f7ff}
    .body{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#c7d5e7}
    .chip{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8edcc9}
    .formula{font:600 15px ui-monospace,"SFMono-Regular",Consolas,monospace;fill:#ffffff}
    .line{fill:none;stroke:#a1b7d3;stroke-width:2.2;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1160" height="440" rx="24" fill="url(#bg)"/>
<text x="44" y="42" class="title">Action-chunk correction at execution step t+k</text>
<text x="45" y="67" class="sub">Frozen base policy runs per chunk · Correction head runs on each selected action</text>
<rect x="44" y="103" width="282" height="132" rx="16" fill="#1b304d" stroke="#507294"/>
<text x="62" y="127" class="chip">FROZEN POLICY</text>
<text x="62" y="158" class="head">OpenPI-Comet / π₀.₅</text>
<text x="62" y="184" class="body">Source observation + task</text>
<text x="62" y="207" class="body">No VLA retraining</text>
<rect x="400" y="103" width="312" height="132" rx="16" fill="#203b61" stroke="#7098c6"/>
<text x="420" y="128" class="chip">CHUNK CONTEXT</text>
<text x="420" y="157" class="head">Base action A<tspan baseline-shift="sub" font-size="12">t</tspan>[k]</text>
<text x="420" y="181" class="body">32-step chunk · 23-D action</text>
<text x="420" y="207" class="body">Cached policy prefix latent z<tspan baseline-shift="sub" font-size="11">t</tspan></text>
<rect x="854" y="103" width="259" height="132" rx="16" fill="#1a4b4e" stroke="#56b7a4"/>
<text x="873" y="128" class="chip">EXECUTED ACTION</text>
<text x="873" y="165" class="formula">clip(base + λ·Δa)</text>
<text x="873" y="196" class="body">Robot action limits</text>
<path d="M327 169 L397 169" class="line"/>
<path d="M714 166 L849 166" class="line"/>
<rect x="44" y="286" width="355" height="105" rx="16" fill="#27354e" stroke="#6d829d"/>
<text x="62" y="311" class="chip">LATEST EXECUTION-FRAME SIGNALS</text>
<text x="62" y="341" class="head">RGB · state · language</text>
<text x="62" y="365" class="body">Depth / task info when configured</text>
<rect x="482" y="286" width="360" height="105" rx="16" fill="#383050" stroke="#a397cd"/>
<text x="502" y="311" class="chip" style="fill:#dbbbff">TRAINABLE CORRECTION HEAD</text>
<text x="502" y="341" class="head">Token fusion · Transformer · MLP</text>
<text x="502" y="365" class="body">Predict residual Δa for current offset k</text>
<path d="M401 338 L477 338" class="line"/>
<path d="M562 236 L562 281" class="line"/>
<text x="574" y="263" class="sub">base context + offset</text>
<path d="M845 338 L977 338 L977 239" class="line"/>
<text x="44" y="421" class="sub">Optional inputs: depth, camera poses, task features, and policy timing · See docs/method.md</text>
</svg>
